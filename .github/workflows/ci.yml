name: NOVA Studio CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nova_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nova_studio_test"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_studio_test?schema=public
      SESSION_SECRET: ci-only-secret-that-is-longer-than-32-characters
      PUBLIC_WEBSITE_URL: http://localhost:3000
      PRIVATE_STORAGE_DIR: ./.private-storage-ci
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: CI-only-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma validate
      - name: Validate production environment contract
        run: npm run validate:env
        env:
          NODE_ENV: production
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Verify deployment artifact
        run: |
          test -f .next/BUILD_ID || { echo "Missing .next/BUILD_ID — production artifact incomplete"; exit 1; }
          test -d node_modules/.prisma/client || { echo "Missing generated Prisma client"; exit 1; }
          echo "Build artifact verified: BUILD_ID=$(cat .next/BUILD_ID)"
      - run: npm audit --audit-level=high
